{% extends "base.html" %}

{% block title %}Fésoif - ajout boisson{% endblock %}

{% block content %}
<a href="{{ url_for('drinks') }}" class="btn">Retour à la liste des boissons</a>

<link rel="stylesheet" href="../static/styles/style_login.css">

<form action="/drinks/create" method="post">
    <h1>Ajouter une boisson</h1>
    <label for="alcool">Alcool:</label>
    <input type="checkbox" id="alcool" name="alcool" checked><br><br>

    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom" required><br><br>

    <label for="degre">% Alcool:</label>
    <input type="number" id="degre" name="degre" step="0.1" required><br><br>

    <label for="ingredients">Ingrédients:</label>
    <textarea id="ingredients" name="ingredients" required></textarea><br><br>

    <label for="description">Description:</label>
    <textarea id="description" name="description"></textarea><br><br>

    <button type="submit">Ajouter</button>
</form>
{% endblock %}
