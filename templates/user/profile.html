{% extends "base.html" %}

{% block title %}Fésoif - Profil{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="btn">Retour à l'accueil</a>
<a href="{{ url_for('logout_route') }}" class="btn">Se déconnecter</a>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
{% if success %}
<div class="success">{{ success }}</div>
{% endif %}

<link rel="stylesheet" href="../static/styles/style_login.css">

<form method="post" action="{{ url_for('edit_profile_route') }}">
    <h2>Profil utilisateur</h2>
    <label>Pseudo: </label><input type="text" name="pseudo" value="{{ user.pseudo }}" required>
    <label>Email : </label><input type="email" name="email" value="{{ user.email }}" required>
    <label>Âge : </label><input type="number" name="âge" value="{{ user.âge }}" required>
    <label>Poids : </label><input type="number" name="poids" value="{{ user.poids }}" required>
    <label for="genre">Genre :</label>
    <label class="radio">
        <input name="genre" type="radio" value="Homme" required>
        <span>Homme</span>
    </label>
    <label class="radio">
        <input name="genre" type="radio" value="Femme" required>
        <span>Femme</span>
    </label>
    <label class="radio">
        <input name="genre" type="radio" value="Non_spec" required>
        <span>Non spécifié</span>
    </label>
    <label>Mot de passe actuel : <input type="password" name="current_password" required></label>
    <label>Nouveau mot de passe : <input type="password" name="new_password"></label>
    <button type="submit">Enregistrer les modifications</button>
</form>
{% endblock %}
